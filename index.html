<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFBF6" />
    <title>Bunny's Home</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bunny's Home" />
    <meta name="description" content="给 AI 一个家 —— 你和 Elliott 的私人空间" />
    <link rel="icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>

    <!-- 出错时别白屏：把错误直接写在页面上 -->
    <script>
      window.__crash = function (msg) {
        var el = document.getElementById('boot-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'boot-error';
          el.style.cssText =
            'position:fixed;left:0;right:0;bottom:0;max-height:50%;overflow:auto;margin:0;padding:16px;' +
            'background:#2b2620;color:#f3d9c9;font:12px/1.7 monospace;z-index:99999;white-space:pre-wrap;';
          document.body.appendChild(el);
        }
        el.textContent += msg + '\n';
      };
      window.addEventListener('error', function (e) {
        window.__crash('[error] ' + (e.message || e.type) + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__crash('[promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          window.__crash('[stuck] 3 秒内没有渲染出任何东西');
        }
      }, 3000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
